# ─────────────────────────────────────────────────────────────────────────────
# PATIO — Firmenserver-Stack (in sich geschlossen)
#
#   postgres  postgres:16        — Datenbank, nur im internen Netz
#   app       (Build aus Dockerfile) — Web-API + Weboberflaeche
#   caddy     caddy:2-alpine     — TLS, einziger Dienst mit Ports nach aussen
#
# Ein Rechner, eine Anwendung, kein Aussenkontakt. Der frueher hier stehende
# Stack haing am externen Docker-Netz `proxy` (gemeinsamer Edge-Caddy der VPS,
# an dem mehrere Projekte hingen) — auf einem Buerorechner mit genau einer
# Anwendung ist das unnoetige Kopplung: ohne das fremde Netz kam der Stack
# gar nicht erst hoch. Die VPS-Variante liegt weiterhin unter
# docker/docker-compose.vps.yml.
#
# TLS: Caddy betreibt eine EIGENE Zertifizierungsstelle auf diesem Rechner
# (`tls internal`, siehe docker/Caddyfile) und erneuert selbstaendig — ohne
# Internet, ohne Let's Encrypt, ohne dass der interne Rechnername irgendwo
# oeffentlich auftaucht. Einmalig muss das CA-Wurzelzertifikat auf die
# Arbeitsplaetze; wie, steht in docs/betrieb/zertifikat.md.
#
# ACHTUNG bei der Sicherung: der private Schluessel dieser CA liegt im Volume
# `caddy_data`. Geht es verloren, erzeugt Caddy eine NEUE CA — und jeder
# Arbeitsplatz zeigt wieder eine Warnung, bis das neue Wurzelzertifikat
# ueberall eingespielt ist. scripts/backup.sh sichert das Volume deshalb mit.
#
# Zum DB-Image: hier stand `pgvector/pgvector:pg16`. Dieses Spezial-Image ist
# im internetlosen Buero nicht zu beschaffen, und PATIO braucht es seit AP0
# nicht mehr. Benoetigt werden nur uuid-ossp, pg_trgm und unaccent — alle drei
# contrib und im offiziellen postgres:16 enthalten.
#
# Auf dem Server wird NIE gebaut. Das fertige Image kommt per
# scripts/release-offline.sh vom Entwicklungsrechner und wird mit
# scripts/update-offline.sh eingespielt. Der `build`-Block gilt nur fuer den
# Entwicklungsrechner.
#
# Start:  docker compose up -d
# Logs:   docker compose logs -f
# Stop:   docker compose down
# ─────────────────────────────────────────────────────────────────────────────

name: patio

services:
  postgres:
    image: postgres:16
    container_name: patio-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patio}
      POSTGRES_DB: ${POSTGRES_DB:-patio}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Auf 16 GB abgestimmt. Die Vorgabewerte von Postgres sind fuer einen
    # Buerorechner zu klein: shared_buffers steht per Default auf 128 MB,
    # also einem Prozent des vorhandenen Speichers.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=50
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Guertel zum Hosentraeger: legt die Extensions schon beim ersten Start
      # an, damit die Datenbank auch ohne Migrationslauf brauchbar ist.
      # Migration 001 legt dieselben noch einmal mit IF NOT EXISTS an.
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patio} -d ${POSTGRES_DB:-patio}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks: [internal]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: patio-app:latest
    container_name: patio-app
    restart: always
    env_file: .env
    environment:
      # Service-zu-Service-URLs ueberschreiben alles aus .env.
      DATABASE_URL: postgres://${POSTGRES_USER:-patio}:${POSTGRES_PASSWORD:-patio}@postgres:5432/${POSTGRES_DB:-patio}
      WORKSPACE_PATH: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Der Dokumentenordner. Die Anwendung schreibt hier nichts hinein —
      # Hochgeladenes liegt in der Datenbank; gelesen wird nur fuer
      # Alt-Datensaetze aus der Vault-Zeit.
      #
      # Bis zum 29.08.2026 war dieses Verzeichnis zugleich die Samba-Freigabe
      # „Dokumente". Die ist entfallen; von aussen erreichbar ist der Ordner
      # nicht mehr.
      #
      # Es muss uid 1000 gehoeren — der Container laeuft als `node`
      # (Dockerfile: USER node). Gehoert es root, kann der Dienst die alten
      # Datensaetze nicht mehr lesen:
      #   sudo chown -R 1000:1000 /opt/patio-workspace
      - ${WORKSPACE_HOST_DIR:-./workspace}:/workspace
      - ./logs:/opt/patio/logs
      - ./data:/opt/patio/data
      - ./tools:/opt/patio/tools
      # Sicherungsverzeichnis, NUR LESEND. Der Dienst zeigt damit unter
      # „Verwaltung -> Sicherung", wann zuletzt gesichert wurde und ob es
      # geklappt hat. Schreiben darf er dort nichts: die Sicherung selbst
      # laeuft als systemd-Timer auf dem Host (deploy/patio-backup.timer).
      #
      # Ohne diese Anzeige faellt eine seit Wochen still scheiternde Sicherung
      # erst auf, wenn man sie braucht — `OnFailure=` schreibt ins Journal, und
      # dort schaut niemand hinein.
      - ${BACKUP_DIR:-/mnt/patio-backup}:/opt/patio/backup:ro
    # Kein `ports:` — erreichbar nur ueber Caddy.
    expose:
      - "3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    container_name: patio-caddy
    restart: always
    # Der einzige Dienst mit Ports nach aussen. 80 bleibt offen, damit Caddy
    # auf HTTPS umleiten kann — wer patio.sima.intern ohne Schema eintippt,
    # landet sonst im Nichts.
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Rechnername, unter dem die Arbeitsplaetze PATIO erreichen. Muss im
      # Router-DNS (oder ersatzweise in der hosts-Datei je Platz) auf diesen
      # Rechner zeigen — sonst nuetzt das beste Zertifikat nichts.
      PATIO_HOSTNAME: ${PATIO_HOSTNAME:-patio.sima.intern}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Enthaelt den privaten Schluessel der internen CA — siehe Kopf.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks: [internal]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
