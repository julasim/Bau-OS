# ─────────────────────────────────────────────────────────────────────────────
# Bau-OS Docker Compose — 3-Service-Architektur (Edge-Proxy uebernimmt TLS)
#
#   postgres  pgvector/pgvector:pg16  — DB + Vector-Extension
#   ollama    ollama/ollama           — LLM-Runtime + Embeddings
#   app       (Build aus Dockerfile)  — Bau-OS Telegram-Bot + WebUI + API
#
# TLS + Reverse-Proxy: zentral via /opt/proxy (julasim/Proxy auf GitHub).
# Bau-OS haengt sich ueber das externe Docker-Netzwerk `proxy` an den
# Edge-Caddy. Der Edge-Caddy kuemmert sich um Let's-Encrypt + Routing
# fuer alle Apps die im proxy-Netzwerk sind.
#
# Vorbereitung (einmalig pro VPS):
#   cd /opt/proxy && docker compose up -d
#   → legt das Docker-Netzwerk `proxy` an + startet edge-caddy auf 80/443.
#
# Start Bau-OS:
#   docker compose up -d
# Logs:
#   docker compose logs -f
# Update:
#   git pull && docker compose pull && docker compose build app && docker compose up -d
# Stop:
#   docker compose down
#
# Standalone-Modus (ohne Edge-Proxy):
#   Wenn kein zentraler Edge-Proxy existiert, Block "caddy" wieder aktivieren
#   (siehe Git-History vor dem Edge-Proxy-Umzug) und proxy-Network entfernen.
# ─────────────────────────────────────────────────────────────────────────────

name: bau-os

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bauos-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bauos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bauos}
      POSTGRES_DB: ${POSTGRES_DB:-bauos}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bauos} -d ${POSTGRES_DB:-bauos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Postgres bleibt intern. Wer von aussen debuggen will, kann
    # ports: ["127.0.0.1:5432:5432"] zusetzen, sollte das aber bewusst tun.
    networks:
      - default

  ollama:
    image: ollama/ollama:latest
    container_name: bauos-ollama
    restart: always
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Ollama bleibt intern, nur app redet mit ihm via Service-Name.
    networks:
      - default
    # GPU-Support (optional, erfordert nvidia-container-toolkit auf dem Host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  app:
    build: .
    image: bau-os-app:latest
    container_name: bauos-app
    restart: always
    env_file: .env
    environment:
      # Service-zu-Service-URLs ueberschreiben alles aus .env.
      DATABASE_URL: postgres://${POSTGRES_USER:-bauos}:${POSTGRES_PASSWORD:-bauos}@postgres:5432/${POSTGRES_DB:-bauos}
      OLLAMA_BASE_URL: http://ollama:11434/v1
      WORKSPACE_PATH: /workspace
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ${WORKSPACE_HOST_DIR:-./workspace}:/workspace
      - ./logs:/opt/bau-os/logs
      - ./data:/opt/bau-os/data
      - ./tools:/opt/bau-os/tools
      - ./.chat_id:/opt/bau-os/.chat_id
    # Port 3000 nur container-intern — Edge-Caddy proxied via proxy-Netzwerk.
    expose:
      - "3000"
    networks:
      - proxy    # externes Netzwerk vom zentralen Edge-Caddy
      - default  # internes Netzwerk fuer postgres + ollama

volumes:
  postgres_data:
  ollama_models:

networks:
  # Externes Docker-Netzwerk vom zentralen Edge-Proxy (/opt/proxy).
  # Wird vom edge-caddy + jeder externen App geteilt. Muss VOR dem
  # ersten Bau-OS-Start existieren — wird vom Edge-Proxy-Stack angelegt.
  proxy:
    external: true
  # Internes Bau-OS-Netzwerk fuer postgres + ollama + app.
  # Compose erstellt das automatisch — Definition hier rein zur
  # Klarheit, damit alle Services explizit ein Netzwerk referenzieren.
  default:
