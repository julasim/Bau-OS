# ─────────────────────────────────────────────────────────────────────────────
# PATIO — Standalone Docker Compose (Kunden-Installation)
#
# Enthält alle 3 Services inkl. Caddy für automatisches HTTPS.
# Setzt voraus: CADDY_DOMAIN und CADDY_EMAIL in .env gesetzt.
#
# Der frueher hier definierte Service `ollama` ist entfallen: seit AP0 gibt es
# weder LLM-Laufzeit noch Embeddings, kein Code liest OLLAMA_BASE_URL mehr.
# Ohne Internet liess sich das Image nicht ziehen — und weil `app` per
# depends_on daran hing, kam der GESAMTE Stack nicht hoch.
#
# Start:   docker compose -f docker-compose.standalone.yml up -d
# Logs:    docker compose -f docker-compose.standalone.yml logs -f
# Update:  git pull && docker compose -f docker-compose.standalone.yml build app && \
#          docker compose -f docker-compose.standalone.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

name: patio

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: patio-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patio}
      POSTGRES_DB: ${POSTGRES_DB:-patio}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patio} -d ${POSTGRES_DB:-patio}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: patio-app:latest
    container_name: patio-app
    restart: always
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-patio}:${POSTGRES_PASSWORD:-patio}@postgres:5432/${POSTGRES_DB:-patio}
      WORKSPACE_PATH: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${WORKSPACE_HOST_DIR:-../workspace}:/workspace
      - ../logs:/opt/patio/logs
      - ../data:/opt/patio/data
      - ../tools:/opt/patio/tools
    expose:
      - "3000"
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: patio-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@patio.local}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - internal

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
