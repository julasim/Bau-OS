# ============================================================
# PATIO Backup — Cron-Konfiguration
# ============================================================
#
# Installation:
#   sudo crontab -e
#   # Folgende Zeile hinzufuegen:
#   0 3 * * * /bin/bash /opt/patio/scripts/backup.sh >> /opt/patio/logs/backup.log 2>&1
#
# Zeitplan:
#   Taeglich um 03:00 Uhr
#   Logs werden nach /opt/patio/logs/backup.log geschrieben
#
# Was wird gesichert:
#   - Obsidian Vault (/opt/patio-vault/) — Notizen, Tasks, Termine, Agent-Memory
#   - .env — API-Keys, JWT_SECRET, Konfiguration  (chmod 600 nach Backup)
#   - data/ — users.json, tasks.json, team.json
#   - tools/ — Vom Agent erstellte dynamische Tools
#   - PostgreSQL (Container patio-postgres) — separater .sql.gz-Dump
#     mit --clean --if-exists, direkt einspielbar
#
# Was wird NICHT gesichert:
#   - node_modules/ — reinstallierbar via npm install
#   - dist/ — rebuildfaehig via npm run build
#   - logs/ — operationelle Daten, nicht kritisch
#
# Rotation:
#   Backups aelter als 14 Tage werden automatisch geloescht
#   (RETENTION_DAYS=14 als Env-Variable ueberschreibbar)
#
# Restore:
#   sudo bash /opt/patio/scripts/restore.sh \
#     /opt/patio-backups/patio-backup-YYYYMMDD-HHMMSS.tar.gz \
#     /opt/patio-backups/patio-db-YYYYMMDD-HHMMSS.sql.gz
#   (DB-Dump wird automatisch erkannt wenn weggelassen)
#
# Manuelles Backup:
#   sudo bash /opt/patio/scripts/backup.sh
#
# Benutzerdefinierte Pfade:
#   sudo bash /opt/patio/scripts/backup.sh /opt/patio /opt/patio-vault /mnt/backup
#
# ============================================================

# Cron-Zeile (in sudo crontab -e einfuegen):
0 3 * * * /bin/bash /opt/patio/scripts/backup.sh >> /opt/patio/logs/backup.log 2>&1
