# ─────────────────────────────────────────────────────────────────────────────
# PATIO — Samba-Freigabe "Dokumente"
#
# Einbinden in /etc/samba/smb.conf:
#     include = /opt/patio/deploy/smb-patio.conf
# Danach:  sudo testparm && sudo systemctl reload smbd
#
# ── Warum das hier ueberhaupt heikel ist ─────────────────────────────────────
#
# Auf /opt/patio-workspace greifen ZWEI Wege zu:
#   1. der PATIO-Dienst im Container — er laeuft als `node` = uid 1000
#      (Dockerfile: USER node)
#   2. die Kolleginnen und Kollegen ueber diese Freigabe im Explorer
#
# Schreiben beide mit verschiedenen Kennungen, kann jeweils der andere die
# Datei nicht mehr aendern. Der Fehler zeigt sich dann an ganz anderer Stelle,
# weil stille catch-Bloecke ihn maskieren — im Playbook trat er einmal als
# "LLM nicht erreichbar" auf, obwohl nur das Log-Schreiben scheiterte.
#
# ACHTUNG, das steht heute falsch in der Anleitung: scripts/install.sh legt den
# Dienstbenutzer mit `useradd -r` an, also als SYSTEMKONTO mit einer uid
# UNTERHALB von 1000. docs/betrieb/server.md gab das Verzeichnis frueher genau
# diesem Benutzer. Wer dem folgte, baute sich den Fehler ein.
#
# Richtig ist:  sudo chown -R 1000:1000 /opt/patio-workspace
#
# `force user` unten sorgt dafuer, dass ALLES, was ueber die Freigabe
# hereinkommt, ebenfalls uid 1000 gehoert — unabhaengig davon, wer es
# geschrieben hat.
# ─────────────────────────────────────────────────────────────────────────────

[global]
    # Nur SMB3. SMB1 ist seit Jahren als unsicher bekannt (WannaCry lief
    # darueber) und wird von aktuellen Windows-Versionen ohnehin nicht mehr
    # standardmaessig gesprochen.
    server min protocol = SMB3
    client min protocol = SMB3

    # Signieren erzwingen — verhindert, dass jemand im selben Netz die
    # Verbindung uebernimmt.
    server signing = mandatory

    # Nur das Bueronetz. Anpassen an das tatsaechliche Segment.
    hosts allow = 192.168.0.0/16 127.0.0.1
    hosts deny = 0.0.0.0/0

    # Kein Gastzugang, keine Drucker, keine Standardfreigaben.
    map to guest = never
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

    # Kein NetBIOS-Namensdienst und keine Broadcast-Ankuendigung — der Server
    # wird ueber DNS gefunden, nicht ueber Zurufe ins Netz.
    disable netbios = yes
    smb ports = 445

    log level = 1
    log file = /var/log/samba/log.%m
    max log size = 1000

[Dokumente]
    comment = PATIO — Projektdokumente
    path = /opt/patio-workspace

    # Nur diese Gruppe. NICHT "jeder" — hier liegen Bauherrenunterlagen,
    # Honorarnoten und Personendaten.
    #     sudo groupadd patio-buero
    #     sudo usermod -aG patio-buero <benutzer>
    #     sudo smbpasswd -a <benutzer>
    valid users = @patio-buero
    invalid users = root
    guest ok = no

    browseable = yes
    read only = no

    # DIE zentrale Zeile: alles, was hereinkommt, gehoert uid 1000 — derselben
    # Kennung, unter der der Dienst im Container schreibt. Ohne sie legt jede
    # Person Dateien unter ihrer eigenen Kennung an, und der Dienst kann sie
    # spaeter nicht mehr aendern.
    force user = patio-dateien
    force group = patio-buero

    # Rechte fuer neue Dateien und Ordner: Eigentuemer und Gruppe duerfen
    # alles, der Rest nichts.
    create mask = 0660
    force create mode = 0660
    directory mask = 0770
    force directory mode = 0770

    # ── Papierkorb ──────────────────────────────────────────────────────────
    # Ohne den ist ein im Explorer geloeschter Projektordner SOFORT weg — und
    # die Datensaetze in der Datenbank zeigen ins Leere. Der Papierkorb der
    # Anwendung kommt erst mit AP5; bis dahin ist das hier die einzige
    # Rueckholmoeglichkeit zwischen zwei naechtlichen Sicherungen.
    vfs objects = recycle
    recycle:repository = .papierkorb/%U
    recycle:keeptree = yes
    recycle:versions = yes
    recycle:touch = no
    recycle:directory_mode = 0770
    # Was gar nicht erst aufgehoben wird: Office-Sperrdateien und
    # Windows-Beiwerk. Sonst fuellt sich der Papierkorb mit Muell.
    recycle:exclude = *.tmp|~$*|.~lock.*|Thumbs.db|desktop.ini
    recycle:exclude_dir = .papierkorb

    # Der Papierkorb bekommt das DOS-Attribut "versteckt": der Explorer blendet
    # ihn aus, damit ihn niemand versehentlich als Projektordner benutzt. Wer
    # etwas zurueckholen will, schaltet "Ausgeblendete Elemente" ein und findet
    # dort seinen eigenen Unterordner mit der urspruenglichen Ordnerstruktur.
    #
    # Bewusst NICHT `veto files` — das machte den Papierkorb unerreichbar, und
    # damit waere er nutzlos.
    hide files = /.papierkorb/
    veto files = /.DS_Store/

    # Keine Symlinks nach draussen — sonst waere ueber die Freigabe der ganze
    # Server lesbar.
    follow symlinks = no
    wide links = no
