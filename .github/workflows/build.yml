# ─────────────────────────────────────────────────────────────────────────────
# PATIO — CI Build & Test
# ─────────────────────────────────────────────────────────────────────────────
# Letzte Verteidigungslinie: laeuft auf jeden Push und PR. Faengt Fehler die
# der Pre-Push-Hook lokal nicht gefangen hat (--no-verify, fremde Maschine,
# Race-Condition).
#
# Was geprueft wird (gleiche Checks wie .husky/pre-push):
#   - Backend-TypeScript (tsc --noEmit)
#   - Frontend-TypeScript (vue-tsc --noEmit)
#   - Vite-Production-Build der SPA — faengt SFC-Parse-Errors,
#     Import-Fehler, fehlende Assets etc.
#   - Vitest-Suite — GEGEN EINE ECHTE POSTGRES-DATENBANK. Ohne sie
#     ueberspringen sich rund 70 Prozent der Pruefungen still und der Lauf
#     meldet trotzdem gruen; genau die ACL-, Auth- und Datenbanktests waeren
#     dann nicht gelaufen. Deshalb der `services`-Block unten.
#
# Wenn was rot wird: GitHub markiert den Commit mit X, du siehst es sofort
# auf der PR-Seite oder am main-Branch-Status. Der Bug-Workflow wird damit
# nicht stiller (man pusht, geht ins Bett, am naechsten Morgen ist die
# Production kaputt — passiert nicht mehr).
# ─────────────────────────────────────────────────────────────────────────────

name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Concurrency: nur ein CI-Run pro Branch parallel — neue Pushes brechen
# alte Runs ab, sparen Minuten.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: tsc + vue-tsc + vite build + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # ── Warum hier eine Datenbank steht ──────────────────────────────────────
    #
    # Bis hierher lief `npm test` in der CI OHNE `DATABASE_URL`. Gemessen am
    # 23.08.2026 heisst das: 15 von 60 Testdateien laufen, 45 ueberspringen
    # sich (`describe.skipIf(!HAS_DB)`), 155 von 599 Pruefungen werden
    # ausgefuehrt — und der Lauf endet mit Exit 0.
    #
    # Damit hat die CI ausgerechnet das nicht geprueft, was am haeufigsten
    # kaputtgeht: die Rechte. Siebzehn Routen ohne Projektpruefung sind an
    # einer gruenen CI vorbeigekommen, und die Tests, die sie jetzt absichern,
    # waeren dort weiterhin nicht gelaufen.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: patio
          POSTGRES_PASSWORD: patio
          POSTGRES_DB: patio
        ports:
          - 5432:5432
        # Ohne Healthcheck startet der Vitest-Schritt, bevor Postgres
        # Verbindungen annimmt — das faellt dann als „connection refused" auf
        # und sieht aus wie ein Testfehler.
        options: >-
          --health-cmd "pg_isready -U patio -d patio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # volle Git-History fuer den gitleaks-Scan

      # Secret-Scan der Git-History VOR npm ci (node_modules ist gitignored,
      # wird also nie mitgescannt). .gitleaks.toml erbt die Default-Regeln und
      # allowlistet nur das bekannte Dummy-TOTP-Seed. Findet gitleaks etwas
      # Neues -> exit != 0 -> CI rot. Lokal mit 8.30.1 verifiziert: 0 Findings.
      - name: Gitleaks (Secret-Scan)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --no-banner --redact

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # Electron ist seit AP12 devDependency (Arbeitsplatz-Programm). Sein
        # postinstall laedt sonst bei JEDEM Lauf rund 100 MB Binaerdatei aus dem
        # Netz — die Binaerdatei wird hier nie gebraucht: die CI baut kein
        # Paket und startet kein Fenster, sie prueft nur Typen, Lint und Tests.
        # `npm run dist` laeuft ausschliesslich auf Julius' Maschine (dort
        # liegt auch das Signaturzertifikat).
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      - name: Production-Build (build:all = tsc + vite, identisch zu Docker)
        # Identische Kommando-Kette wie der Dockerfile-Build-Step.
        # Faengt:
        #   - Backend-TypeScript-Fehler (incl. strict JSONValue-Constraints)
        #   - Vue-SFC-Parse-Errors, kaputte Mustaches
        #   - fehlende Imports
        #   - Asset-Resolution-Probleme
        run: npm run build:all

      - name: Frontend TypeScript (vue-tsc)
        # npm run nutzt die in devDependencies GEPINNTE vue-tsc (node_modules/.bin)
        # statt `npx` ohne Pin die neueste zu ziehen (die mit TS 6 bricht — TEST-1).
        run: npm run typecheck:web

      # Zwei Bereiche, die `npm run build:all` NICHT erfasst: die tsconfig.json
      # im Root schliesst nur `src/**/*` ein. Bis hierher wurden `scripts/` und
      # `electron/` (das Arbeitsplatz-Programm aus AP12) in der CI also von
      # keiner Typpruefung angefasst — ein Fehler dort waere erst auf Julius'
      # Maschine beim `npm run build:electron` aufgeschlagen.
      #
      # Die Electron-Typen liegen im npm-Paket selbst (electron.d.ts), nicht in
      # der Binaerdatei — der Schritt funktioniert also trotz
      # ELECTRON_SKIP_BINARY_DOWNLOAD oben.
      - name: Backend-Skripte + Arbeitsplatz-Huelle (tsc)
        run: |
          npm run typecheck:scripts
          npm run typecheck:electron

      - name: Lint (eslint)
        run: npm run lint

      # Migrationen VOR den Tests anwenden. Die Suite setzt ein fertiges
      # Schema voraus — sie legt Testdaten an, sie baut die Tabellen nicht.
      - name: Migrationen auf die Test-Datenbank anwenden
        env:
          DATABASE_URL: postgres://patio:patio@localhost:5432/patio
        run: npm run db:migrate

      - name: Vitest (mit Datenbank — sonst laufen 70 % der Pruefungen nicht)
        env:
          DATABASE_URL: postgres://patio:patio@localhost:5432/patio
          # Die Auth-Tests brauchen ein Secret; ohne bricht der Import von
          # config.ts in einzelnen Suiten ab.
          JWT_SECRET: ci-nur-fuer-tests-mindestens-32-zeichen-lang
          WORKSPACE_PATH: /tmp/patio-workspace
        run: |
          mkdir -p /tmp/patio-workspace
          npm test
