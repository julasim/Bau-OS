# ─────────────────────────────────────────────────────────────────────────────
# PATIO — CI Build & Test
# ─────────────────────────────────────────────────────────────────────────────
# Letzte Verteidigungslinie: laeuft auf jeden Push und PR. Faengt Fehler die
# der Pre-Push-Hook lokal nicht gefangen hat (--no-verify, fremde Maschine,
# Race-Condition).
#
# Was geprueft wird. Der Pre-Push-Hook faehrt davon nur `build:all`, `vue-tsc`
# und `npm test` — und letzteres OHNE Datenbank, ueberspringt also lokal den
# groesseren Teil der Pruefungen. Hier laufen zusaetzlich Lint, die beiden
# uebrigen tsc-Projekte, die Migrationen gegen einen frischen Postgres,
# Gitleaks und der Docker-Bau:
#   - Backend-TypeScript (tsc --noEmit)
#   - Frontend-TypeScript (vue-tsc --noEmit)
#   - Vite-Production-Build der SPA — faengt SFC-Parse-Errors,
#     Import-Fehler, fehlende Assets etc.
#   - Vitest-Suite — GEGEN EINE ECHTE POSTGRES-DATENBANK. Ohne sie
#     ueberspringen sich rund 70 Prozent der Pruefungen still und der Lauf
#     meldet trotzdem gruen; genau die ACL-, Auth- und Datenbanktests waeren
#     dann nicht gelaufen. Deshalb der `services`-Block unten.
#   - Docker-Bau der builder-Stufe — gleicher Befehl, andere Umgebung. Das
#     Bau-Image hat weder `git` noch ein Repository; ein Doku-Bau, der
#     `git log` ruft, faellt nur dort auf, nicht auf dem Runner.
#
# Wenn was rot wird: GitHub markiert den Commit mit X, du siehst es sofort
# auf der PR-Seite oder am main-Branch-Status. Der Bug-Workflow wird damit
# nicht stiller (man pusht, geht ins Bett, am naechsten Morgen ist die
# Production kaputt — passiert nicht mehr).
# ─────────────────────────────────────────────────────────────────────────────

name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Concurrency: nur ein CI-Run pro Branch parallel — neue Pushes brechen
# alte Runs ab, sparen Minuten.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: tsc + vue-tsc + vite build + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # ── Warum hier eine Datenbank steht ──────────────────────────────────────
    #
    # Bis hierher lief `npm test` in der CI OHNE `DATABASE_URL`. Gemessen am
    # 23.08.2026 heisst das: 15 von 60 Testdateien laufen, 45 ueberspringen
    # sich (`describe.skipIf(!HAS_DB)`), 155 von 599 Pruefungen werden
    # ausgefuehrt — und der Lauf endet mit Exit 0.
    #
    # Damit hat die CI ausgerechnet das nicht geprueft, was am haeufigsten
    # kaputtgeht: die Rechte. Siebzehn Routen ohne Projektpruefung sind an
    # einer gruenen CI vorbeigekommen, und die Tests, die sie jetzt absichern,
    # waeren dort weiterhin nicht gelaufen.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: patio
          POSTGRES_PASSWORD: patio
          POSTGRES_DB: patio
        ports:
          - 5432:5432
        # Ohne Healthcheck startet der Vitest-Schritt, bevor Postgres
        # Verbindungen annimmt — das faellt dann als „connection refused" auf
        # und sieht aus wie ein Testfehler.
        options: >-
          --health-cmd "pg_isready -U patio -d patio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # volle Git-History fuer den gitleaks-Scan

      # Secret-Scan der Git-History VOR npm ci (node_modules ist gitignored,
      # wird also nie mitgescannt). .gitleaks.toml erbt die Default-Regeln und
      # allowlistet nur das bekannte Dummy-TOTP-Seed. Findet gitleaks etwas
      # Neues -> exit != 0 -> CI rot. Lokal mit 8.30.1 verifiziert: 0 Findings.
      - name: Gitleaks (Secret-Scan)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --no-banner --redact

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # Electron ist seit AP12 devDependency (Arbeitsplatz-Programm). Sein
        # postinstall laedt sonst bei JEDEM Lauf rund 100 MB Binaerdatei aus dem
        # Netz — die Binaerdatei wird hier nie gebraucht: die CI baut kein
        # Paket und startet kein Fenster, sie prueft nur Typen, Lint und Tests.
        # `npm run dist` laeuft ausschliesslich auf Julius' Maschine (dort
        # liegt auch das Signaturzertifikat).
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      - name: Production-Build (build:all = tsc + vite + VitePress)
        # Gleicher Befehl wie im Dockerfile — aber NICHT dieselbe Pruefung.
        # Der Runner hat `git` und ein ausgechecktes `.git`; der builder-Stage
        # hat beides nicht: `.dockerignore` schliesst `.git/` aus, und
        # `node:24-bookworm-slim` bringt kein git mit (die apt-Schicht im
        # Dockerfile installiert nur python3/make/g++).
        #
        # Genau daran ist der Docker-Bau am 06.08.2026 mit `23d4f9a`
        # gescheitert: `docs:build` wanderte in `build:all`, VitePress ruft je
        # Doku-Seite `git log` fuers Aenderungsdatum, und der Bau brach mit
        # „spawn git ENOENT" ab. Hier blieb es 45 Commits lang gruen, waehrend
        # kein Image mehr baute und `scripts/release-offline.sh` kein Paket
        # schnueren konnte. Behoben ueber `lastUpdated: false` in
        # docs/.vitepress/config.ts — und abgesichert durch den Job
        # `docker-build` unten.
        #
        # Was dieser Schritt also leistet: Fehler im CODE faengt er. Alles, was
        # nur der Container hat — fehlende apt-Pakete, `npm prune --omit=dev`,
        # die Laufzeit-Stufe mit ihren COPY-Pfaden — kann hier grundsaetzlich
        # nicht auffallen. Dafuer gibt es nur einen echten `docker build`.
        #
        # Faengt:
        #   - Backend-TypeScript-Fehler (incl. strict JSONValue-Constraints)
        #   - Vue-SFC-Parse-Errors, kaputte Mustaches
        #   - fehlende Imports
        #   - Asset-Resolution-Probleme
        #   - Fehler in der VitePress-Doku (docs:build ist Teil von build:all)
        run: npm run build:all

      - name: Frontend TypeScript (vue-tsc)
        # npm run nutzt die in devDependencies GEPINNTE vue-tsc (node_modules/.bin)
        # statt `npx` ohne Pin die neueste zu ziehen (die mit TS 6 bricht — TEST-1).
        run: npm run typecheck:web

      # Zwei Bereiche, die `npm run build:all` NICHT erfasst: die tsconfig.json
      # im Root schliesst nur `src/**/*` ein. Bis hierher wurden `scripts/` und
      # `electron/` (das Arbeitsplatz-Programm aus AP12) in der CI also von
      # keiner Typpruefung angefasst — ein Fehler dort waere erst auf Julius'
      # Maschine beim `npm run build:electron` aufgeschlagen.
      #
      # Die Electron-Typen liegen im npm-Paket selbst (electron.d.ts), nicht in
      # der Binaerdatei — der Schritt funktioniert also trotz
      # ELECTRON_SKIP_BINARY_DOWNLOAD oben.
      - name: Backend-Skripte + Arbeitsplatz-Huelle (tsc)
        run: |
          npm run typecheck:scripts
          npm run typecheck:electron

      - name: Lint (eslint)
        run: npm run lint

      # Migrationen VOR den Tests anwenden. Die Suite setzt ein fertiges
      # Schema voraus — sie legt Testdaten an, sie baut die Tabellen nicht.
      - name: Migrationen auf die Test-Datenbank anwenden
        env:
          DATABASE_URL: postgres://patio:patio@localhost:5432/patio
        run: npm run db:migrate

      - name: Vitest (mit Datenbank — sonst laufen 70 % der Pruefungen nicht)
        env:
          DATABASE_URL: postgres://patio:patio@localhost:5432/patio
          # Die Auth-Tests brauchen ein Secret; ohne bricht der Import von
          # config.ts in einzelnen Suiten ab.
          JWT_SECRET: ci-nur-fuer-tests-mindestens-32-zeichen-lang
          WORKSPACE_PATH: /tmp/patio-workspace
        run: |
          mkdir -p /tmp/patio-workspace
          npm test

  # ── Warum dieser Job zusaetzlich zum Job oben steht ───────────────────────
  #
  # Der Schritt „Production-Build" oben ruft denselben Befehl wie das
  # Dockerfile. Der BEFEHL ist identisch, die UMGEBUNG nicht: Der Runner hat
  # das Programm `git` und ein Repository, das Bau-Image hat weder noch
  # (`.dockerignore` schliesst `.git/` aus). Genau in dieser Luecke ist der
  # Docker-Bau am 06.08.2026 gebrochen — VitePress ruft je Doku-Seite
  # `git log`, der Aufruf scheitert mit `spawn git ENOENT`, und damit kippt
  # der GESAMTE Bau. Gemerkt hat es 45 Commits lang niemand: die CI blieb
  # gruen, und auf dem Server wird nie gebaut. Aufgefallen ist es erst, als
  # scripts/release-offline.sh kein Paket mehr schnueren konnte.
  #
  # Ein eigener Job und kein Schritt im Job oben: Er laeuft parallel, braucht
  # weder Node noch Postgres auf dem Runner, und solange der Testlauf oben
  # laenger dauert, verlaengert er den CI-Lauf um null Minuten.
  docker-build:
    name: docker build --target builder
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        # Bewusst flach (kein `fetch-depth: 0` wie oben — das ist dort nur
        # fuer Gitleaks noetig). Die History braucht hier niemand, und `.git/`
        # erreicht den Bau-Kontext ohnehin nicht. Dass sie im Image fehlt, ist
        # der Sinn dieses Jobs: nur so faellt ein wieder eingeschalteter
        # `git log` im Doku-Bau auf, bevor das Auslieferungspaket dran ist.
        uses: actions/checkout@v4

      - name: Buildx einrichten
        # Noetig fuer den Schichten-Zwischenspeicher unten: der Standard-
        # Treiber von `docker build` kann `type=gha` nicht.
        uses: docker/setup-buildx-action@v3

      - name: Builder-Stufe bauen (ohne LibreOffice)
        # `target: builder` haelt vor Stufe 2 an. Stufe 2 installiert rund
        # 350 MB libreoffice-writer und kopiert danach nur noch fertige Ordner
        # aus Stufe 1 herein — kaputtgehen kann an einem Commit die Stufe 1:
        # npm ci (bcrypt wird nativ uebersetzt), tsc, vite, vitepress,
        # npm prune. Die 350 MB bei jedem Push zu ziehen kauft nichts; das
        # vollstaendige Image baut scripts/release-offline.sh vor jedem Paket.
        #
        # `push`/`load` bleiben aus: Gebraucht wird nicht das Image, sondern
        # die Antwort auf „laeuft der Bau durch". Das spart den Export des
        # rund 1 GB grossen Zwischenimages in den Docker-Daemon.
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
